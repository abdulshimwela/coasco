<!doctype html>
<html lang="sw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6b1a2a">
<meta name="robots" content="noindex, nofollow">
<title>COASCO — Ufuatiliaji wa Ukaguzi na Ada</title>
<style>
  html, body { margin: 0; height: 100%; background: #6b1a2a; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #f4f2f1; }
  .wait { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
          color: #fff; font-family: "Trebuchet MS", Arial, sans-serif; font-size: 15px; gap: 14px; text-align: center; padding: 16px; }
  .wait b { font-size: 22px; letter-spacing: .04em; }
  .wait a { color: #fff; }
  .ring { width: 34px; height: 34px; border: 3px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: s 1s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .ring { animation: none; } }
</style>
</head>
<body>
<div class="wait" id="wait">
  <b>COASCO · Kanda ya Mbeya</b>
  <div class="ring" aria-hidden="true"></div>
  <span>Mfumo unafunguka…</span>
  <small id="slow" hidden>Inachukua muda? <a href="https://script.google.com/macros/s/AKfycby42nmYl-rK1fYD4wNOW8iea5q46M8v7ptnWti-NeFFcLjLj8ierDW-MgBHJW5i7SEAHw/exec" target="_top">Fungua mfumo moja kwa moja</a></small>
</div>
<iframe id="app" title="COASCO — Ufuatiliaji wa Ukaguzi na Ada" src="https://script.google.com/macros/s/AKfycby42nmYl-rK1fYD4wNOW8iea5q46M8v7ptnWti-NeFFcLjLj8ierDW-MgBHJW5i7SEAHw/exec" allow="clipboard-write"></iframe>
<script>
  // Hide the loading screen once the app has loaded; offer a direct link if it is slow.
  var f = document.getElementById('app'), w = document.getElementById('wait');
  f.style.visibility = 'hidden';
  f.addEventListener('load', function () { f.style.visibility = 'visible'; w.style.display = 'none'; });
  setTimeout(function () { document.getElementById('slow').hidden = false; }, 15000);
</script>
</body>
</html>
